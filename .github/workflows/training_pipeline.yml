name: Weekly AQI Model Retraining Pipeline

on:
  schedule:
    # Runs at 00:00 every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  train-models:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Historical Backfill (Grab latest data)
      env:
        OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      run: python src/feature_pipeline/fetch_historical.py
      
    - name: Run Feature Engineering (Calculate true AQI & Lags)
      run: python src/feature_pipeline/etl_pipeline.py
      
    - name: Train Models
      run: python src/training_pipeline/train_models.py
      
    - name: Commit and Push Updated Models
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/ models/
        git commit -m "Auto-update: Retrained XGBoost models with latest data" || echo "No changes to commit"
        git push